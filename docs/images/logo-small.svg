  <g fill="none" stroke="#FFD102" stroke-width="130" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 220 H250 A90 90 0 0 0 160 310 V714 A90 90 0 0 0 250 804 H330"/>
    <path d="M694 220 H774 A90 90 0 0 1 864 310 V714 A90 90 0 0 1 774 804 H694"/>
  </g>
  <polygon points="440,390 640,512 440,634" fill="#EA362A" stroke="#EA362A" stroke-width="60" stroke-linejoin="round"/>
</svg>

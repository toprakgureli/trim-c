name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution trim-c.slnx --configuration Release

      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Version '${{ github.ref_name }}'.TrimStart('v')

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts -File | ForEach-Object FullName) `
            --title 'trim-c ${{ github.ref_name }}' `
            --notes-file build/release-notes.md

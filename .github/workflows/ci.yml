name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The integration tests drive the real ffmpeg and are skipped where it is not installed.
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Build
        run: dotnet build trim-c.slnx --configuration Release

      - name: Test
        run: dotnet test --solution trim-c.slnx --configuration Release --no-build

      - name: Formatting
        if: runner.os == 'Linux'
        run: dotnet format trim-c.slnx --verify-no-changes
